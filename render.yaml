services:
  - type: web
    name: srotaai
    runtime: python
    buildCommand: pip install -r requirements.txt && cp srotaai_seed.db srotaai.db
    startCommand: uvicorn srotaai.web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    # NOTE: no persistent disk. The previous config mounted a disk at the
    # project root, which hides the deployed source. The demo DB is rebuilt
    # from srotaai_seed.db on every deploy; add a disk only after moving
    # DB_PATH (srotaai/web/app.py) to a dedicated mount such as /var/data.
